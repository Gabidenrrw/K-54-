name: transfer_demo
description: "Demonstration of a transfer confirmation layout. No banking operations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/reference.png
    - assets/images/receipt_reference.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: RobotoEntry
      fonts:
        - asset: assets/fonts/RobotoEntry-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoEntry-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoEntry-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoEntry-Bold.ttf
          weight: 700
